<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - CNS Limpeza</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white rounded-xl shadow-lg max-w-md w-full p-8 space-y-6">
    <div class="text-center">
      <h1 class="text-2xl font-bold text-slate-800">Controle de Estoque & Pedidos</h1>
      <p class="text-xs text-slate-500 mt-1">Acesse com seu e-mail e senha de 6 dígitos</p>
    </div>

    <div class="space-y-4">
      <div>
        <label class="block text-xs font-bold uppercase text-slate-600 mb-1">E-mail</label>
        <input type="email" id="login-email" placeholder="usuario@email.com" class="w-full border rounded-lg px-3 py-2.5 text-sm" />
      </div>

      <div>
        <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Senha (6 dígitos)</label>
        <input type="password" id="login-senha" minlength="6" placeholder="••••••" class="w-full border rounded-lg px-3 py-2.5 text-sm" />
      </div>

      <button onclick="fazerLogin()" id="btn-entrar" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg text-sm transition">
        ENTRAR NO SISTEMA
      </button>

      <div class="border-t pt-4 text-center">
        <button onclick="enviarEmailRedefinicao()" class="text-xs font-semibold text-blue-600 hover:underline">
          Alterar / Esqueci minha senha (Receber link por e-mail)
        </button>
      </div>
    </div>
  </div>

  <script>
    async function fazerLogin() {
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-senha').value.trim();

      if (!email || !password) return alert('Preencha o e-mail e a senha!');

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) return alert('Erro no login: Verifique seu e-mail e senha.');

      // Busca o perfil (role) do usuário logado
      const { data: perfil } = await supabaseClient
        .from('profiles')
        .select('role')
        .eq('id', data.user.id)
        .single();

      const role = perfil ? perfil.role : 'encarregado';

      if (role === 'coordenador') {
        window.location.href = 'master.html';
      } else if (role === 'cadastro') {
        window.location.href = 'cadastro-usuarios.html';
      } else {
        window.location.href = 'index.html';
      }
    }

    async function enviarEmailRedefinicao() {
      const email = document.getElementById('login-email').value.trim();
      if (!email) return alert('Digite seu e-mail no campo acima primeiro e depois clique em Alterar Senha!');

      const urlRedirecionamento = window.location.origin + '/redefinir-senha.html';
      const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
        redirectTo: urlRedirecionamento
      });

      if (error) return alert('Erro ao enviar e-mail: ' + error.message);
      alert('E-mail enviado com sucesso! Verifique sua caixa de entrada (e spam) para alterar sua senha.');
    }
  </script>
</body>
</html>
